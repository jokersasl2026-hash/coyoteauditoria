<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Totales Coyote Online</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .header {
            text-align: center;
            background-color: #1a252f;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        .header img {
            max-height: 70px;
            width: auto;
            margin-bottom: 8px;
        }
        .header h1 { margin: 0; font-size: 24px; color: #f1c40f; letter-spacing: 0.5px; }
        .header p { margin: 4px 0 0 0; color: #bdc3c7; font-size: 14px; }
        
        .panel-totales {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }
        
        .card-total {
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        
        .card-neto { background-color: #16a085; border: 2px solid #1abc9c; }
        .card-in { background-color: #27ae60; border: 2px solid #2ecc71; }
        .card-out { background-color: #2980b9; border: 2px solid #3498db; }
        
        .card-total h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; }
        .card-total p { margin: 8px 0 0 0; font-size: 32px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Logo Coyote" onerror="this.style.display='none';">
        <h1>RECAUDACIÓN GENERAL EN VIVO</h1>
        <p id="txt-reloj">Conectando al servidor central...</p>
    </div>

    <!-- PANELES DE TOTALES COMPACTOS -->
    <div class="panel-totales">
        <div class="card-total card-neto">
            <h3>Balance Neto Global (Ganancia)</h3>
            <p id="neto-global">Gs. 0</p>
        </div>
        <div class="card-total card-in">
            <h3>Total IN (Entradas Totales)</h3>
            <p id="total-in">Gs. 0</p>
        </div>
        <div class="card-total card-out">
            <h3>Total OUT (Premios)</h3>
            <p id="total-out">Gs. 0</p>
        </div>
    </div>

    <script>
        // Apuntamos directamente a la ruta exacta autorizada en las reglas de tu Firebase
        var urlApiRest = "https://firebaseio.com";

        function formatearGs(monto) {
            return "Gs. " + Number(monto).toLocaleString('de-DE');
        }

        async function actualizarTotalesSala() {
            try {
                var respuesta = await fetch(urlApiRest);
                if (!respuesta.ok) return;
                
                var data = await respuesta.json();
                if (!data) return;

                // Al consultar la subcarpeta directa, las variables se inyectan sin intermediarios
                document.getElementById('neto-global').innerText = formatearGs(data.neto_global || 0);
                document.getElementById('total-in').innerText = formatearGs(data.total_in_global || 0);
                document.getElementById('total-out').innerText = formatearGs(data.total_out_global || 0);
                document.getElementById('txt-reloj').innerText = "Última Actualización: " + (data.ultima_actualizacion || '--/--/---- --:--:--');
            } catch (error) {
                console.log("Error de conexión contable: ", error);
            }
        }

        // Consultar de forma inmediata y refrescar de manera automática cada 2 segundos
        actualizarTotalesSala();
        setInterval(actualizarTotalesSala, 2000);
    </script>
</body>
</html>
